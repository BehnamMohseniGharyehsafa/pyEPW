name: Feature request
description: Propose an API, data source or documentation improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need and example
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Proposed approach or data source
      description: For new providers, include documentation, licence, access limits and variable/time definitions.
